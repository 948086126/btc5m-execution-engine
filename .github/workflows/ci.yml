name: go-ci

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Test
        run: go test -count=1 ./...
      - name: Build Linux live source
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath ./cmd/live_source
